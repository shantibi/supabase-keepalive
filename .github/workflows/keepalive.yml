name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after 7 days with no requests. This
# workflow pings each project every 3 days (well under the threshold) so none of
# them ever idle out. The final step also commits a timestamp, which keeps GitHub
# from auto-disabling this scheduled workflow after 60 days of repo inactivity.

on:
  schedule:
    # Twice daily (12h apart). GitHub's scheduler is best-effort and occasionally
    # drops a run; two per day means even several skips stay far under the 7-day
    # pause threshold.
    - cron: "0 6 * * *"  # 06:00 UTC
    - cron: "0 18 * * *" # 18:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ping each Supabase project
        run: |
          set -u
          set +e  # GitHub runs this step with errexit on; turn it OFF so one
                  # unreachable project (e.g. one already paused → host stops
                  # resolving) can't abort the loop before the others are pinged.
          # "Name|project-ref|table|publishable(anon) key" — anon/publishable keys
          # are client-public by design. The ping is a lightweight SELECT on a real
          # table, which counts as DATABASE activity. (An /auth/v1/health check does
          # NOT reset Supabase's pause timer — that's why an earlier version of this
          # workflow let projects pause despite getting HTTP 200.)
          PROJECTS=(
            "Dissertation Muse|rgnvtvjfnnpchyzrkgtl|research_papers|sb_publishable_abAw7vXLC3FhQWCiG3beOQ_BPf5WUCp"
            "Mindful Selfish Teacher|prynyomewwdpluafbccx|events|sb_publishable_6E8NSY3wGMPeIiSE4nb3qw_BXiUpKsq"
            "Property Grabber (Pull.land)|cgikjiuwgrnjluwvjiqe|parcels|sb_publishable_EsOyn2_86y-U3y07qEsf7g_JUdZ13So"
            "EdBud|lcxoxbutkjorfddralaa|registries|sb_publishable_H4STQPsWLDwbDOrUSmJXWA_ig1iqhu2"
          )
          for p in "${PROJECTS[@]}"; do
            IFS='|' read -r name ref table key <<< "$p"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://$ref.supabase.co/rest/v1/$table?limit=1" \
              -H "apikey: $key" -H "Authorization: Bearer $key" || true)
            echo "$name ($ref -> $table): HTTP $code"
          done
          # One unreachable/paused project logs HTTP 000 and the loop keeps going.

      - name: Record last run (keeps this scheduled workflow enabled)
        run: |
          date -u +"Last keep-alive run: %Y-%m-%dT%H:%M:%SZ" > last-run.md
          git config user.name "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.md
          git commit -m "keep-alive $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push || echo "push skipped"
